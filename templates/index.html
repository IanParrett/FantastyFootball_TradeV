<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trade Analyzer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="page">
    <h1 class="title">Trade Analyzer</h1>

    <div class="league-settings">
      <div class="league-format-toggle">
        <span class="field-label">League Format</span>
        <label>
          <input type="radio" name="league-format" value="redraft" checked />
          Redraft (single season)
        </label>
        <label>
          <input type="radio" name="league-format" value="dynasty" />
          Dynasty / Keeper (multi-year)
        </label>
      </div>
      <div class="scoring-format-toggle">
        <span class="field-label">Scoring Format</span>
        <label>
          <input type="radio" name="scoring-format" value="standard" />
          Standard
        </label>
        <label>
          <input type="radio" name="scoring-format" value="half_ppr" checked />
          Half-PPR
        </label>
        <label>
          <input type="radio" name="scoring-format" value="full_ppr" />
          Full PPR
        </label>
      </div>
      <div class="misc-format-toggle">
        <label>
          <input type="checkbox" id="superflex-toggle" />
          Superflex / 2QB
        </label>
      </div>
      <label class="salary-toggle">
        <input type="checkbox" id="salary-league-toggle" />
        This is a salary-cap league
      </label>
      <label class="field salary-cap-field hidden">
        <span class="field-label">League Salary Cap</span>
        <input type="number" id="salary-cap-input" step="any" min="0" />
      </label>
    </div>

    <div class="auction-values-section">
      <button type="button" id="toggle-auction-values" class="toggle-auction-values-btn">
        Show Auction Values
      </button>
      <div id="auction-values-panel" class="auction-values-panel hidden">
        <div class="auction-position-tabs">
          <button type="button" class="position-tab active" data-position="ALL">All</button>
          <button type="button" class="position-tab" data-position="QB">QB</button>
          <button type="button" class="position-tab" data-position="RB">RB</button>
          <button type="button" class="position-tab" data-position="WR">WR</button>
          <button type="button" class="position-tab" data-position="TE">TE</button>
          <button type="button" class="position-tab" data-position="K">K</button>
        </div>
        <div class="auction-values-table-wrap">
          <table class="auction-values-table">
            <thead>
              <tr>
                <th>Rank</th>
                <th>Player</th>
                <th>Pos</th>
                <th>Team</th>
                <th>Auction Value</th>
              </tr>
            </thead>
            <tbody id="auction-values-body"></tbody>
          </table>
        </div>
      </div>
    </div>

    <form id="trade-form" class="split-container">
      <div class="panel panel-dark" data-side="team_a">
        <h2 class="panel-heading">Team One</h2>
        <div class="players-list"></div>
        <button type="button" class="add-player-btn">+ Add Player</button>
      </div>

      <span class="for-label">for</span>

      <div class="panel panel-light" data-side="team_b">
        <h2 class="panel-heading">Team Two</h2>
        <div class="players-list"></div>
        <button type="button" class="add-player-btn">+ Add Player</button>
      </div>
    </form>

    <button type="submit" form="trade-form" class="analyze-btn">Analyze Trade</button>

    <section id="results" class="results hidden"></section>
  </div>

  <template id="player-slot-template">
    <div class="player-slot">
      <button type="button" class="remove-player-btn hidden" aria-label="Remove player">&times;</button>
      <label class="field player-search">
        <span class="field-label">Player Name</span>
        <input type="text" name="name" autocomplete="off" placeholder="Start typing to select a player..." required />
        <ul class="player-suggestions hidden"></ul>
      </label>
      <input type="hidden" name="age" value="" />
      <input type="hidden" name="position" value="" />
      <input type="hidden" name="sleeper_id" value="" />
      <label class="field contract-field hidden">
        <span class="field-label">Contract (yrs)</span>
        <input type="number" name="contract_length" min="0" value="0" />
      </label>
      <label class="field salary-field hidden">
        <span class="field-label">League Salary</span>
        <input type="number" name="salary" step="any" />
      </label>
      <input type="hidden" class="stats-data" value="[]" />
    </div>
  </template>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
